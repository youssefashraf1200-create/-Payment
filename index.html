<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Payment Method</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#f5f7fb,#eef2f7);min-height:100vh;color:#172033}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);background:#fff;border-radius:26px;padding:32px 22px;box-shadow:0 15px 45px rgba(0,0,0,.10);text-align:center}.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;background:#172033;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}h1{margin:0 0 7px;font-size:27px}p{margin:0 0 24px;color:#687386}.btn{width:100%;border:0;border-radius:15px;padding:17px 18px;margin:7px 0;font-size:17px;font-weight:700;cursor:pointer}.inst{background:#5b2bbf;color:#fff}.eta{background:#087f39;color:#fff}.info{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#f3f5f8}.label{font-weight:700}.value{font-size:18px;font-weight:700;direction:ltr;text-align:center;margin:12px 0;word-break:break-all}.copy{border:0;border-radius:10px;padding:10px 18px;background:#172033;color:#fff;cursor:pointer}.note{font-size:12px;color:#7b8491;margin-top:20px}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="avatar">YA</div>
<h1>Choose Payment Method</h1>
<p>Youssef Ashraf</p>
<button class="btn inst" onclick="openInstaPay()">Pay with InstaPay</button>
<button class="btn eta" onclick="show('cash')">Pay with Etisalat Cash</button>
<section id="cash" class="info"><div class="label">Etisalat Cash Number</div><div class="value">01156496613</div><button class="copy" onclick="copyText('01156496613')">Copy</button></section>
<div class="note">Choose your preferred payment method to complete your payment.</div>
</main></div>
<script>
function openInstaPay(){window.location.href='https://ipn.eg/S/yousef.ashraf.ahmed/instapay/3U3hki'}
function show(id){document.querySelectorAll('.info').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block'}
function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('Copied'))}else{alert(t)}}
</script>
</body></html>
